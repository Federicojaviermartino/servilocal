# La aplicación entera en local, tal como se despliega: la base con PostGIS,
# la API y el frontend, construidos con sus propios Dockerfile.
#
#   docker compose up --build
#   docker compose exec -e SEMILLA_CONFIRMAR=servilocal api node dist/database/seeds/run-seed.js
#
# y después http://localhost:3000. La API corre las migraciones al arrancar;
# la semilla, que vacía la base antes de sembrarla, pide que se confirme el
# nombre de la base porque «db» no es un host local.
#
# Para desarrollar con recarga en caliente basta con la base
# (`docker compose up -d db`) y npm en cada carpeta: ver el README.
#
# Los secretos de aquí solo sirven en local. Los pagos no funcionan con la
# clave de marcador: para probarlos, pon las tuyas de prueba de Stripe.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: servilocal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servilocal
      POSTGRES_USER: servilocal_user
      POSTGRES_PASSWORD: servilocal_dev_2026
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servilocal_user -d servilocal']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: servilocal-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: servilocal_user
      DB_PASSWORD: servilocal_dev_2026
      DB_DATABASE: servilocal
      JWT_SECRET: solo_para_docker_compose_en_local_y_nada_mas
      JWT_EXPIRATION: 24h
      CORS_ORIGINS: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_placeholder
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      # La dirección que usa el navegador: se incrusta al compilar.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: servilocal-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # La que usa el servidor del frontend: dentro de esta red, la API se
      # llama «api». Ver frontend/src/lib/api-servidor.ts.
      API_INTERNA: http://api:3001/api
    depends_on:
      - api

volumes:
  pgdata:
