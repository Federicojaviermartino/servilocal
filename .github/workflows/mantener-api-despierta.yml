name: Mantener la demo despierta

# Las instancias gratuitas de Render se duermen tras 15 minutos sin tráfico y
# tardan cerca de un minuto en volver. Este flujo llama al frontend y a la API
# cada pocos minutos para que la demo no haga esperar a quien la visita en
# horario laboral, y avisa si alguno de los dos no responde.
#
# No se puede contar con él: GitHub retrasa y se salta las ejecuciones
# programadas, y lo que de verdad mantiene despierta la demo es un monitor
# externo. Ver docs/OPERATIONS.md, «External monitor». Esto es la segunda
# línea, y el aviso por correo cuando algo no contesta.
#
# Aritmética del cupo: Render concede 750 horas mensuales POR WORKSPACE,
# repartidas entre todos los servicios gratuitos. Este workspace tiene cuatro.
# De 08:00 a 15:59 más los 15 minutos que tardan en dormirse, son unas 8 h 15
# min por servicio y día: con dos servicios, unas 510 h en un mes de 31 días,
# lo que deja unas 240 h para el resto. Ampliar la franja o añadir servicios
# puede agotar el cupo, y entonces Render suspende TODOS los servicios
# gratuitos hasta el mes siguiente.
#
# Cada ejecución es una ronda corta de peticiones, y nada más. La primera de
# cada hora es la completa —la portada y /api/health, que consulta la base—;
# las demás llaman a /salud y /api/health/vivo, que no la tocan. Así,
# mantener despierta la demo no impide que Neon suspenda su cómputo, que lo
# hace a los cinco minutos sin actividad y cuesta solo un arranque en frío
# de la base.
#
# Lo que se probó y no funcionó. El 29/09/2026 solo empezaron 23 de las 77
# ejecuciones previstas en una mañana, y para cubrir los huecos cada
# ejecución pasó a quedarse 45 minutos llamando en bucle, con una nueva cada
# 10. Al día siguiente esas ejecuciones, solapadas de dos en dos y de cuatro
# en cuatro, sumaron 18 horas de máquina, y desde el 1 de octubre GitHub
# dejó de lanzar más de dos o tres al día, algunas fuera de la franja. No se
# puede demostrar que una cosa causara la otra, pero un bucle de espera no
# es para lo que están las acciones, y con él la demo quedó peor que antes.
# Se vuelve a una ronda corta por ejecución, de una en una.

# Aviso que conviene tener presente: GitHub desactiva solo los flujos
# programados de un repositorio tras 60 días sin actividad, y avisa por correo
# antes de hacerlo. No hay forma de evitarlo desde aquí; se reactiva con un
# clic en la pestaña de acciones. Si la demo vuelve a dormirse sin motivo
# aparente, este es el primer sitio donde mirar.

on:
  schedule:
    # Cada 5 minutos, de 08:03 a 15:58 UTC, fuera del minuto 0, que es cuando
    # GitHub más retrasa. Son las 10:00-17:59 en horario de verano peninsular
    # y 09:00-16:59 en invierno.
    - cron: '3-59/5 8-15 * * *'
  workflow_dispatch:

# Solo hace peticiones a la demo: no necesita ni leer el repositorio.
permissions: {}

# De una en una. Tras un retraso GitHub lanza varias seguidas: la segunda
# espera a la primera en vez de sumarse a ella.
concurrency:
  group: mantener-la-demo-despierta
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Llamar al frontend y a la API
        env:
          DISPARO: ${{ github.event_name }}
        run: |
          # Una ejecución programada que GitHub arranca tarde, fuera de la
          # franja, no llama a nada: despertaría los servicios a deshoras,
          # que es gastar el cupo. A mano se puede lanzar cuando sea.
          hora=$(date -u +%H)
          if [ "$DISPARO" = "schedule" ] && { [ "$hora" -lt 8 ] || [ "$hora" -ge 16 ]; }; then
            echo "Fuera de la franja (las $hora UTC): no se llama a nada."
            exit 0
          fi

          # La primera de cada hora, y las lanzadas a mano, la completa.
          if [ "$DISPARO" != "schedule" ] || [ "$(date -u +%M)" -lt 8 ]; then
            direcciones="https://servilocal-web.onrender.com https://servilocal-api.onrender.com/api/health"
          else
            direcciones="https://servilocal-web.onrender.com/salud https://servilocal-api.onrender.com/api/health/vivo"
          fi

          # Falla si CUALQUIERA de los dos no responde. Antes exigía que
          # cayeran los dos a la vez, así que la API podía estar devolviendo
          # 503 —que es lo que hace /api/health cuando la base no contesta— y
          # el flujo se quedaba en verde. Justo el caso que este aviso existe
          # para detectar, y el que este proyecto ya tuvo sin enterarse
          # durante cuatro meses.
          #
          # Se reintenta una vez antes de darlo por malo: el arranque en frío
          # del plan gratuito tarda cerca de un minuto y a veces se lleva por
          # delante el primer intento. Un fallo de verdad no se arregla en
          # veinte segundos.
          #
          # El «|| true» es porque el paso corre con bash -e: sin él, un curl
          # que no conecta o se queda sin tiempo terminaba el paso ahí mismo,
          # sin reintentar ni decir qué dirección había fallado.
          fallos=0
          for url in $direcciones; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            if [ "$codigo" != "200" ]; then
              echo "$url -> $codigo, reintentando"
              sleep 20
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            fi
            echo "$url -> $codigo"
            if [ "$codigo" != "200" ]; then
              echo "::error::$url respondió $codigo en lugar de 200"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ]
