name: Mantener la API despierta

# Las instancias gratuitas de Render se duermen tras 15 minutos sin tráfico y
# tardan cerca de un minuto en volver. Este flujo las despierta con una
# petición periódica para que la demo no haga esperar a quien la visita.
#
# Importante: las 750 horas mensuales del plan gratuito son POR WORKSPACE y se
# reparten entre todos los servicios. Por eso solo se hace ping en horario
# diurno (unas 360 h al mes) en vez de las 24 horas, que consumirían el cupo
# entero y suspenderían el resto de servicios del workspace.
#
# La petición ataca un endpoint que consulta la base de datos, de modo que
# también evita que el cómputo de Neon se suspenda por inactividad.

on:
  schedule:
    # Cada 10 minutos, de 08:00 a 19:59 UTC (10:00-21:59 en horario peninsular)
    - cron: '*/10 8-19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la API
        run: |
          URL="https://servilocal-api.onrender.com/api/categories"
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL")
          echo "Respuesta de $URL: $CODIGO"
          if [ "$CODIGO" != "200" ]; then
            echo "::warning::La API respondió $CODIGO en lugar de 200"
          fi
