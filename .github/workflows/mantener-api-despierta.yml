name: Mantener la demo despierta

# Las instancias gratuitas de Render se duermen tras 15 minutos sin tráfico y
# tardan cerca de un minuto en volver. Este flujo despierta el frontend y la
# API con peticiones periódicas para que la demo no haga esperar a quien la
# visita en horario laboral, y avisa si alguno de los dos no responde.
#
# Aritmética del cupo: Render concede 750 horas mensuales POR WORKSPACE,
# repartidas entre todos los servicios gratuitos. Este workspace tiene cuatro.
# De 08:00 a 15:59 más los 15 minutos que tardan en dormirse, son unas 8 h 15
# min por servicio y día: con dos servicios, unas 510 h en un mes de 31 días,
# lo que deja unas 240 h para el resto. Ampliar la franja o añadir servicios
# puede agotar el cupo, y entonces Render suspende TODOS los servicios
# gratuitos hasta el mes siguiente.
#
# Cada ejecución hace primero la comprobación completa —la portada y
# /api/health, que consulta la base— y falla en ese momento si alguna no
# responde: es el aviso. Después se queda 45 minutos llamando cada 4 a /salud
# y /api/health/vivo, que no tocan la base. Así, mantener despierta la demo
# no impide que Neon suspenda su cómputo, que lo hace a los cinco minutos sin
# actividad y cuesta solo un arranque en frío de la base.
#
# Antes era una sola petición por ejecución, lanzada cada 5 minutos, y no
# bastaba: GitHub retrasa y se salta ejecuciones programadas. El 29/09/2026
# solo empezaron 23 de las 77 previstas entre las 08:00 y las 14:30, con
# huecos de hasta 35 minutos, y la API se durmió cinco veces en una mañana.
# Ahora cada ejecución cubre 45 minutos y se lanza una cada 10, fuera del
# minuto 0, que es cuando GitHub más retrasa: el servicio solo se duerme si
# pasa casi una hora sin que empiece ninguna. Que se solapen no cuesta nada:
# el repositorio es público y el servicio ya estaba despierto.

# Aviso que conviene tener presente: GitHub desactiva solo los flujos
# programados de un repositorio tras 60 días sin actividad, y avisa por correo
# antes de hacerlo. No hay forma de evitarlo desde aquí; se reactiva con un
# clic en la pestaña de acciones. Si la demo vuelve a dormirse sin motivo
# aparente, este es el primer sitio donde mirar.

on:
  schedule:
    # Cada 10 minutos, de 08:03 a 15:53 UTC.
    # Son las 10:00-17:59 en horario de verano peninsular y 09:00-16:59 en invierno.
    - cron: '3-59/10 8-15 * * *'
  workflow_dispatch:

# Solo hace peticiones a la demo: no necesita ni leer el repositorio.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Comprobar el frontend y la API
        run: |
          # Falla si CUALQUIERA de los dos no responde. Antes exigía que
          # cayeran los dos a la vez, así que la API podía estar devolviendo
          # 503 —que es lo que hace /api/health cuando la base no contesta— y
          # el flujo se quedaba en verde. Justo el caso que este aviso existe
          # para detectar, y el que este proyecto ya tuvo sin enterarse
          # durante cuatro meses.
          #
          # Se reintenta una vez antes de darlo por malo: el arranque en frío
          # del plan gratuito tarda cerca de un minuto y a veces se lleva por
          # delante el primer intento. Un fallo de verdad no se arregla en
          # veinte segundos.
          #
          # El «|| true» es porque el paso corre con bash -e: sin él, un curl
          # que no conecta o se queda sin tiempo terminaba el paso ahí mismo,
          # sin reintentar ni decir qué dirección había fallado.
          fallos=0
          for url in \
            "https://servilocal-web.onrender.com" \
            "https://servilocal-api.onrender.com/api/health"
          do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            if [ "$codigo" != "200" ]; then
              echo "$url -> $codigo, reintentando"
              sleep 20
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            fi
            echo "$url -> $codigo"
            if [ "$codigo" != "200" ]; then
              echo "::error::$url respondió $codigo en lugar de 200"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ]

      - name: Mantenerlos despiertos
        run: |
          # Aquí solo cuenta que haya tráfico: la respuesta no se comprueba,
          # de eso se ocupa el paso anterior. Hasta 45 minutos, y nunca pasadas
          # las 15:59 UTC, que es donde acaba la franja del cupo.
          fin=$(( $(date +%s) + 45 * 60 ))
          while sleep 240 && [ "$(date +%s)" -lt "$fin" ] && [ "$(date -u +%H)" -lt 16 ]; do
            curl -s -o /dev/null --max-time 60 "https://servilocal-web.onrender.com/salud" || true
            curl -s -o /dev/null --max-time 60 "https://servilocal-api.onrender.com/api/health/vivo" || true
            echo "$(date -u +%H:%M) despiertos"
          done
