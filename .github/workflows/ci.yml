name: CI

# Corre en cualquier rama, no solo en main.
#
# Antes solo se disparaba en main, develop y las pull requests contra main.
# Trabajando en ramas eso deja el trabajo sin comprobar hasta que ya está
# mezclado, que es cuando enterarse sirve de menos.
on:
  push:
    # Salvo las ramas de Dependabot, que ya se prueban como propuesta:
    # probarlas también al empujar hacía cada comprobación dos veces sin
    # ganar nada.
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]

# El token que GitHub da a cada trabajo tiene los permisos por defecto del
# repositorio si no se dice otra cosa, y eso puede incluir escribir en él.
# Aquí nada escribe: se descarga el código, se compila y se prueba. Si algún
# paso se viera comprometido —una acción de terceros, una dependencia—, con
# esto no podría empujar nada.
permissions:
  contents: read

# Un empujón nuevo a la misma rama deja el anterior sin sentido: se cancela.
# En main no, porque cada commit de main se despliega y tiene que quedar
# probado, y la prueba de humo espera a que termine esta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_test
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci || {
            echo "::error::npm ci ha rechazado el lockfile. Se genera en Windows y se instala en Linux, y npm resuelve las dependencias de pares distinto en cada uno. Regenéralo con 'npm run lock' en la carpeta del paquete y vuelve a subirlo."
            exit 1
          }

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar tests con umbral de cobertura
        run: npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: servilocal_user
          DB_PASSWORD: test_password
          DB_DATABASE: servilocal_test
          JWT_SECRET: test_jwt_secret
          JWT_EXPIRATION: 1h

      - name: Build
        run: npm run build

  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci || {
            echo "::error::npm ci ha rechazado el lockfile. Se genera en Windows y se instala en Linux, y npm resuelve las dependencias de pares distinto en cada uno. Regenéralo con 'npm run lock' en la carpeta del paquete y vuelve a subirlo."
            exit 1
          }

      - name: Ejecutar linter
        run: npm run lint

      # En la API el formato lo comprueba el propio linter. Aquí no había
      # nada que lo mirara, y cinco ficheros se habían ido desajustando sin
      # que nadie lo notara.
      - name: Comprobar el formato
        run: npm run format:check

      - name: Comprobar tipos
        run: npm run type-check

      - name: Pruebas unitarias con cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      # Una historia rota no rompe la aplicación, así que sin este paso el
      # catálogo de componentes se pudre sin que nadie se entere.
      - name: Compilar el catálogo de componentes
        run: npm run build-storybook -- --quiet

  # Las pruebas de la batería normal usan dobles, y un doble hace lo que se
  # le dice: no sabe si el índice espacial se usa, si el ON CONFLICT acumula,
  # si el bloqueo de fila serializa dos transacciones, que Stripe rechaza un
  # importe que no sea entero, ni en qué orden cierra Nest cada conexión.
  # Todo eso solo lo puede contradecir el software de verdad.
  #
  # stripe-mock es el emulador oficial de Stripe: responde con su esquema y
  # sus códigos de error, y no hace falta ninguna clave.
  integracion:
    name: Integración contra base de datos, Stripe y Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_integracion
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: integracion_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_integracion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe:
        # Fijada: con «latest», un cambio en el emulador podía poner la
        # integración en rojo sin tocar una línea del código.
        image: stripe/stripe-mock:v0.205.0
        ports:
          - 12111:12111
      valkey:
        # Lo que ofrece Render como Key Value. Solo lo usa la prueba del
        # apagado: el orden en que Nest cierra sockets y Redis no se ve con
        # dobles, y en producción tumbaba el proceso en cada apagado.
        image: valkey/valkey:8.1.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: servilocal_user
      DB_PASSWORD: integracion_password
      DB_DATABASE: servilocal_integracion
      JWT_SECRET: secreto_solo_para_los_tests
      JWT_EXPIRATION: 1h
      STRIPE_SECRET_KEY: sk_test_integracion
      STRIPE_MOCK_URL: http://localhost:12111
      REDIS_INTEGRACION_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar y sembrar
        run: |
          npm run migration:run
          npm run seed

      - name: Ejecutar las pruebas de integración
        run: npm run test:integracion

  dependencias:
    name: Vulnerabilidades en producción
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Sin el árbol instalado, npm audit no sabe qué versiones hay de verdad.
      # --ignore-scripts porque aquí no se compila nada nativo y evita
      # ejecutar código de terceros para una simple comprobación.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend

      - name: Comprobar que no hay avisos nuevos
        run: node scripts/auditoria-dependencias.mjs

  secretos:
    name: Secretos filtrados
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Con la historia entera: un secreto borrado en un commit posterior
      # sigue estando en el anterior, y el repositorio es público.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # El binario y no la imagen de Docker: dentro del contenedor, git se
      # niega a leer un repositorio montado que es de otro usuario. Se
      # comprueba la suma antes de ejecutarlo, porque es código de terceros
      # que va a leer todo el historial.
      - name: Buscar secretos en todo el historial
        run: |
          version=8.30.1
          archivo=gitleaks_${version}_linux_x64.tar.gz
          url=https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archivo}
          suma=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$archivo" "$url"
          echo "$suma  $archivo" | sha256sum --check --strict
          tar -xzf "$archivo" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  # Lo que se despliega son estas imágenes, y hasta ahora ninguna prueba las
  # construía: la integración compilaba con npm por su cuenta. Un Dockerfile
  # roto solo se descubría en el despliegue, con la aplicación caída.
  #
  # No se publican, solo se construyen: lo que se comprueba es que el bloqueo
  # de dependencias cuadra —npm ci falla si no— y que las dos etapas llegan
  # hasta el final.
  imagenes:
    name: Construcción de las imágenes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Para arrancar la imagen de verdad. La API corre las migraciones al
    # levantarse, así que le basta una base vacía. Con Valkey, como en
    # producción, para apagarla igual que la apaga Render.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_imagen
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: imagen_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_imagen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8.1.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la API
        run: docker build -t servilocal-api:ci ./backend

      - name: Construir la imagen del frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api \
            -t servilocal-web:ci ./frontend

      # La del frontend se construía y no se encendía nunca: la de extremo a
      # extremo arranca el frontend fuera de Docker. Una imagen a la que le
      # faltara algo que la compilación sí tiene pasaba entera.
      - name: Comprobar que el frontend no corre como root y arranca
        run: |
          usuario=$(docker run --rm --entrypoint sh servilocal-web:ci -c whoami)
          echo "La imagen del frontend corre como: $usuario"
          test "$usuario" = "node"
          docker run -d --name web-ci -p 3000:3000 servilocal-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/salud > /dev/null; then
              echo "El frontend responde tras $((i * 2))s"
              curl -sf -o /dev/null http://localhost:3000/ \
                || (echo "La portada no responde"; docker logs web-ci; exit 1)
              docker rm -f web-ci > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no llegó a responder. Registro del contenedor:"
          docker logs web-ci
          docker rm -f web-ci > /dev/null
          exit 1

      - name: Comprobar que la API no corre como root
        run: |
          usuario=$(docker run --rm --entrypoint sh servilocal-api:ci -c whoami)
          echo "La imagen corre como: $usuario"
          test "$usuario" = "node"

      - name: Comprobar que no se cuela el código fuente ni las herramientas de desarrollo
        run: |
          docker run --rm --entrypoint sh servilocal-api:ci -c "ls -a /app"
          # El fuente no hace falta para servir: las migraciones se resuelven
          # contra dist. Si aparece, la imagen volvió a ser de una sola etapa.
          docker run --rm --entrypoint sh servilocal-api:ci -c "test ! -d /app/src" \
            || (echo "El código fuente no debería estar en la imagen"; exit 1)
          # Se comprueban paquetes que solo existen como dependencia de
          # desarrollo directa. typescript no vale: typeorm lo arrastra a
          # través de ts-node y está en el árbol de producción con razón.
          for paquete in vitest vite @nestjs/cli eslint prettier; do
            docker run --rm --entrypoint sh servilocal-api:ci \
              -c "test ! -d /app/node_modules/$paquete" \
              || (echo "$paquete no debería estar en la imagen"; exit 1)
          done

      # Se construía la imagen, se le miraba por dentro y se daba por buena.
      # Una imagen que no arranca pasaba esas comprobaciones enteras: pasó,
      # y lo que la delató fue el trabajo de extremo a extremo, que arranca
      # la API compilada aparte. Mirar dentro no es lo mismo que encenderla.
      #
      # Y se apaga como la apaga Render, con SIGTERM, exigiendo que salga
      # con 0. Desde la 2.6.0 salía con 1 en cada apagado —cada vez que la
      # API se dormía— y nada lo detectaba: el contenedor se quitaba con
      # «rm -f», que no avisa a nadie.
      - name: Comprobar que la imagen arranca, responde y se apaga limpia
        run: |
          docker run -d --name api-ci --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USERNAME=servilocal_user \
            -e DB_PASSWORD=imagen_password \
            -e DB_DATABASE=servilocal_imagen \
            -e JWT_SECRET=secreto_solo_para_los_tests \
            -e JWT_EXPIRATION=1h \
            -e STRIPE_SECRET_KEY=sk_test_marcador \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e PORT=3001 \
            -e REDIS_URL=redis://localhost:6379 \
            servilocal-api:ci
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "La imagen responde tras $((i * 2))s"
              curl -s http://localhost:3001/api/health
              echo
              docker stop api-ci > /dev/null
              salida=$(docker inspect -f '{{.State.ExitCode}}' api-ci)
              echo "Al apagarse con SIGTERM sale con $salida"
              if [ "$salida" != "0" ]; then
                echo "Tenía que salir con 0. Final del registro del contenedor:"
                docker logs api-ci 2>&1 | tail -20
                docker rm -f api-ci > /dev/null
                exit 1
              fi
              docker rm -f api-ci > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no llegó a responder. Registro del contenedor:"
          docker logs api-ci
          docker rm -f api-ci > /dev/null
          exit 1

  e2e:
    name: Tests de extremo a extremo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_e2e
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: servilocal_user
      DB_PASSWORD: e2e_password
      DB_DATABASE: servilocal_e2e
      JWT_SECRET: secreto_solo_para_los_tests
      JWT_EXPIRATION: 1h
      # Con los secretos definidos, la comprobación de pago se ejecuta de
      # verdad contra Stripe en modo de prueba. Sin ellos queda el marcador y
      # el test se salta solo, que es lo que permite que una bifurcación sin
      # acceso a los secretos siga teniendo la integración en verde.
      #
      # Es el único camino del código que no se cubre sin esto, y justo el
      # que mueve dinero: retener al reservar, cobrar al completar y soltar
      # al cancelar.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_marcador' }}
      # Next incrusta las NEXT_PUBLIC_* al compilar, así que tiene que estar
      # presente en el paso de build y no solo al ejecutar.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      CORS_ORIGINS: http://localhost:3000
      PORT: 3001
      # La suite inicia sesión muchas veces desde la misma IP. El límite
      # real se comprueba aparte; aquí solo estorbaría a los tests de flujo.
      # Lo mismo con crear reservas y enviar mensajes: cuatro navegadores
      # seguidos crean decenas en pocos minutos. Y con el límite general:
      # sin PROXY_SECRETO, todo lo que pasa por el frontend cuenta como un
      # solo visitante, y la campana de avisos de cuatro navegadores llega a
      # las 120 peticiones por minuto de una ruta. Medido: la 121 es un 429.
      THROTTLE_LIMIT: '1000'
      THROTTLE_AUTH_LIMIT: '100'
      THROTTLE_RESERVAS_LIMIT: '100'
      THROTTLE_MENSAJES_LIMIT: '100'
      NEXT_PUBLIC_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Preparar la API
        working-directory: ./backend
        run: |
          npm ci
          npm run migration:run
          npm run seed
          npm run build

      - name: Arrancar la API en segundo plano
        working-directory: ./backend
        env:
          # Solo aquí: a nivel de job haría que npm ci omitiera las
          # dependencias de desarrollo y faltaría el CLI de Nest.
          NODE_ENV: production
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/api/categories > /dev/null; then
              echo "API disponible tras $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "La API no llegó a responder. Últimas líneas del registro:"
          tail -40 api.log
          exit 1

      - name: Preparar el frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          echo "PLAYWRIGHT=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      # Los navegadores pesan cientos de megas y se descargaban en cada
      # ejecución. Se guardan por versión de Playwright.
      - name: Recuperar los navegadores
        id: navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT }}

      # Los tres motores: Chrome, Firefox y el WebKit de Safari. Con Chrome
      # solo, lo que se rompía únicamente en Safari —la página entera por
      # upgrade-insecure-requests, la cookie de sesión por http— no lo veía
      # nadie. Con los navegadores ya guardados, solo faltan las bibliotecas
      # del sistema.
      - name: Instalar los navegadores
        working-directory: ./frontend
        run: |
          if [ "${{ steps.navegadores.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Ejecutar Playwright
        working-directory: ./frontend
        run: npm run e2e

      # Una prueba que falla y pasa al reintentarla deja el trabajo en verde,
      # y antes el informe solo se guardaba si algo fallaba: la traza de lo
      # que había salido mal se perdía. Ahora se guarda siempre, y el
      # resumen cuenta las intermitentes.
      - name: Resumir el resultado
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        run: node ../scripts/resumen-playwright.mjs playwright-report/resultados.json

      - name: Guardar el informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: frontend/playwright-report/
          retention-days: 7
