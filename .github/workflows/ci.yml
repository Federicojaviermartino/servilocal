name: CI

# Corre en cualquier rama, no solo en main.
#
# Antes solo se disparaba en main, develop y las pull requests contra main.
# Trabajando en ramas eso deja el trabajo sin comprobar hasta que ya está
# mezclado, que es cuando enterarse sirve de menos.
on:
  push:
    # Salvo las ramas de Dependabot, que ya se prueban como propuesta:
    # probarlas también al empujar hacía cada comprobación dos veces sin
    # ganar nada.
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]

# El token que GitHub da a cada trabajo tiene los permisos por defecto del
# repositorio si no se dice otra cosa, y eso puede incluir escribir en él.
# Aquí nada escribe: se descarga el código, se compila y se prueba. Si algún
# paso se viera comprometido —una acción de terceros, una dependencia—, con
# esto no podría empujar nada.
permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_test
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci || {
            echo "::error::npm ci ha rechazado el lockfile. Se genera en Windows y se instala en Linux, y npm resuelve las dependencias de pares distinto en cada uno. Regenéralo con 'npm run lock' en la carpeta del paquete y vuelve a subirlo."
            exit 1
          }

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar tests con umbral de cobertura
        run: npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: servilocal_user
          DB_PASSWORD: test_password
          DB_DATABASE: servilocal_test
          JWT_SECRET: test_jwt_secret
          JWT_EXPIRATION: 1h

      - name: Build
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci || {
            echo "::error::npm ci ha rechazado el lockfile. Se genera en Windows y se instala en Linux, y npm resuelve las dependencias de pares distinto en cada uno. Regenéralo con 'npm run lock' en la carpeta del paquete y vuelve a subirlo."
            exit 1
          }

      - name: Ejecutar linter
        run: npm run lint

      - name: Comprobar tipos
        run: npm run type-check

      - name: Pruebas unitarias con cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      # Una historia rota no rompe la aplicación, así que sin este paso el
      # catálogo de componentes se pudre sin que nadie se entere.
      - name: Compilar el catálogo de componentes
        run: npm run build-storybook -- --quiet

  # Las 352 comprobaciones de la batería normal usan dobles, y un doble hace
  # lo que se le dice: no sabe si el índice espacial se usa, si el ON CONFLICT
  # acumula, si el bloqueo de fila serializa dos transacciones, ni que Stripe
  # rechaza un importe que no sea entero. Todo eso solo lo puede contradecir
  # el software de verdad.
  #
  # stripe-mock es el emulador oficial de Stripe: responde con su esquema y
  # sus códigos de error, y no hace falta ninguna clave.
  integracion:
    name: Integración contra base de datos y Stripe
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_integracion
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: integracion_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_integracion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: servilocal_user
      DB_PASSWORD: integracion_password
      DB_DATABASE: servilocal_integracion
      JWT_SECRET: secreto_solo_para_los_tests
      JWT_EXPIRATION: 1h
      STRIPE_SECRET_KEY: sk_test_integracion
      STRIPE_MOCK_URL: http://localhost:12111

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar y sembrar
        run: |
          npm run migration:run
          npm run seed

      - name: Ejecutar las pruebas de integración
        run: npm run test:integracion

  # Lo que se despliega son estas imágenes, y hasta ahora ninguna prueba las
  # construía: la integración compilaba con npm por su cuenta. Un Dockerfile
  # roto solo se descubría en el despliegue, con la aplicación caída.
  #
  # No se publican, solo se construyen: lo que se comprueba es que el bloqueo
  # de dependencias cuadra —npm ci falla si no— y que las dos etapas llegan
  # hasta el final.
  dependencias:
    name: Vulnerabilidades en producción
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Sin el árbol instalado, npm audit no sabe qué versiones hay de verdad.
      # --ignore-scripts porque aquí no se compila nada nativo y evita
      # ejecutar código de terceros para una simple comprobación.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend

      - name: Comprobar que no hay avisos nuevos
        run: node scripts/auditoria-dependencias.mjs

  secretos:
    name: Secretos filtrados
    runs-on: ubuntu-latest

    steps:
      # Con la historia entera: un secreto borrado en un commit posterior
      # sigue estando en el anterior, y el repositorio es público.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # El binario y no la imagen de Docker: dentro del contenedor, git se
      # niega a leer un repositorio montado que es de otro usuario. Se
      # comprueba la suma antes de ejecutarlo, porque es código de terceros
      # que va a leer todo el historial.
      - name: Buscar secretos en todo el historial
        run: |
          version=8.30.1
          archivo=gitleaks_${version}_linux_x64.tar.gz
          url=https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archivo}
          suma=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$archivo" "$url"
          echo "$suma  $archivo" | sha256sum --check --strict
          tar -xzf "$archivo" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  imagenes:
    name: Construcción de las imágenes
    runs-on: ubuntu-latest

    # Para arrancar la imagen de verdad. La API corre las migraciones al
    # levantarse, así que le basta una base vacía.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_imagen
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: imagen_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_imagen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la API
        run: docker build -t servilocal-api:ci ./backend

      - name: Construir la imagen del frontend
        run: |
          docker build             --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api             -t servilocal-web:ci ./frontend

      - name: Comprobar que la API no corre como root
        run: |
          usuario=$(docker run --rm --entrypoint sh servilocal-api:ci -c whoami)
          echo "La imagen corre como: $usuario"
          test "$usuario" = "node"

      - name: Comprobar que no se cuela el código fuente ni las herramientas de desarrollo
        run: |
          docker run --rm --entrypoint sh servilocal-api:ci -c "ls -a /app"
          # El fuente no hace falta para servir: las migraciones se resuelven
          # contra dist. Si aparece, la imagen volvió a ser de una sola etapa.
          docker run --rm --entrypoint sh servilocal-api:ci -c "test ! -d /app/src"             || (echo "El código fuente no debería estar en la imagen"; exit 1)
          # Se comprueban paquetes que solo existen como dependencia de
          # desarrollo directa. typescript no vale: typeorm lo arrastra a
          # través de ts-node y está en el árbol de producción con razón.
          for paquete in vitest vite @nestjs/cli eslint prettier; do
            docker run --rm --entrypoint sh servilocal-api:ci               -c "test ! -d /app/node_modules/$paquete"               || (echo "$paquete no debería estar en la imagen"; exit 1)
          done

      # Se construía la imagen, se le miraba por dentro y se daba por buena.
      # Una imagen que no arranca pasaba esas comprobaciones enteras: pasó,
      # y lo que la delató fue el trabajo de extremo a extremo, que arranca
      # la API compilada aparte. Mirar dentro no es lo mismo que encenderla.
      - name: Comprobar que la imagen arranca y responde
        run: |
          docker run -d --name api-ci --network host             -e DB_HOST=localhost             -e DB_PORT=5432             -e DB_USERNAME=servilocal_user             -e DB_PASSWORD=imagen_password             -e DB_DATABASE=servilocal_imagen             -e JWT_SECRET=secreto_solo_para_los_tests             -e JWT_EXPIRATION=1h             -e STRIPE_SECRET_KEY=sk_test_marcador             -e CORS_ORIGINS=http://localhost:3000             -e PORT=3001             servilocal-api:ci
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "La imagen responde tras $((i * 2))s"
              curl -s http://localhost:3001/api/health
              docker rm -f api-ci > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no llegó a responder. Registro del contenedor:"
          docker logs api-ci
          docker rm -f api-ci > /dev/null
          exit 1

  e2e:
    name: Tests de extremo a extremo
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: servilocal_e2e
          POSTGRES_USER: servilocal_user
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servilocal_user -d servilocal_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: servilocal_user
      DB_PASSWORD: e2e_password
      DB_DATABASE: servilocal_e2e
      JWT_SECRET: secreto_solo_para_los_tests
      JWT_EXPIRATION: 1h
      # Con los secretos definidos, la comprobación de pago se ejecuta de
      # verdad contra Stripe en modo de prueba. Sin ellos queda el marcador y
      # el test se salta solo, que es lo que permite que una bifurcación sin
      # acceso a los secretos siga teniendo la integración en verde.
      #
      # Es el único camino del código que no se cubre sin esto, y justo el
      # que mueve dinero: retener al reservar, cobrar al completar y soltar
      # al cancelar.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_marcador' }}
      # Next incrusta las NEXT_PUBLIC_* al compilar, así que tiene que estar
      # presente en el paso de build y no solo al ejecutar.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      CORS_ORIGINS: http://localhost:3000
      PORT: 3001
      # La suite inicia sesión muchas veces desde la misma IP. El límite
      # real se comprueba aparte; aquí solo estorbaría a los tests de flujo.
      THROTTLE_AUTH_LIMIT: '100'
      NEXT_PUBLIC_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Preparar la API
        working-directory: ./backend
        run: |
          npm ci
          npm run migration:run
          npm run seed
          npm run build

      - name: Arrancar la API en segundo plano
        working-directory: ./backend
        env:
          # Solo aquí: a nivel de job haría que npm ci omitiera las
          # dependencias de desarrollo y faltaría el CLI de Nest.
          NODE_ENV: production
        run: |
          nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/api/categories > /dev/null; then
              echo "API disponible tras $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "La API no llegó a responder. Últimas líneas del registro:"
          tail -40 api.log
          exit 1

      - name: Preparar el frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Ejecutar Playwright
        working-directory: ./frontend
        run: npm run e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: frontend/playwright-report/
          retention-days: 7
