# Los dos servicios de Render, descritos en el repositorio.
#
# Hasta ahora esta configuración solo existía en el panel de Render: cuándo
# se despliega, qué ruta comprueba la salud, la región, el plan o qué
# variables hacen falta no se podían revisar ni rehacer desde aquí, y
# recrear un servicio era hacerlo de memoria. Esto no cambia nada por sí
# solo: hay que enlazarlo en Render como Blueprint (ver docs/OPERATIONS.md).
#
# Lo que difiere de lo que hay hoy en el panel, y es a propósito:
#   - healthCheckPath. Hoy no hay ninguna: Render da por bueno un despliegue
#     en cuanto abre el puerto, y un proceso colgado sigue recibiendo
#     tráfico.
#
# Se despliega con cada commit que llega a main, y no con «checksPass»,
# aunque este pedía esperar a la integración continua. Render no despliega
# si falla cualquier comprobación del commit, y a la cabeza de main se
# cuelgan también la prueba de humo, que espera justo a ese despliegue, y el
# flujo que mantiene despierta la demo, que durante una caída falla y
# bloquearía el commit que la arregla. Lo que tiene que impedir que llegue a
# main algo en rojo es la protección de la rama, exigiendo la integración
# continua, activada desde la 2.7.1: exige los siete trabajos, también a
# quien administra el repositorio, y a main solo llega un commit que ya pasó
# en su rama.
#
# Los secretos van con «sync: false»: Render los pide al crear el servicio y
# nunca se escriben aquí.
services:
  - type: web
    name: servilocal-api
    runtime: docker
    repo: https://github.com/Federicojaviermartino/servilocal
    branch: main
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    # Solo que el proceso responde, sin consultar la base. Render la llama
    # cada pocos segundos y reinicia el servicio si falla un minuto seguido:
    # con /api/health, que sí la consulta, Neon no llegaría a suspenderse
    # nunca mientras la API esté despierta, y con Neon caído o sin cupo la
    # API entraría en un bucle de reinicios que no arregla nada. Que la base
    # responde ya lo exige el arranque, que aplica las migraciones, y lo
    # vigilan la prueba de humo y el aviso de cada hora.
    healthCheckPath: /api/health/vivo
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRATION
        value: 24h
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROXY_SECRETO
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Opcionales: sin ellas, lo que dependa de cada una se apaga y la API
      # arranca igual. Ver la tabla de configuración del README.
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: servilocal-web
    runtime: docker
    repo: https://github.com/Federicojaviermartino/servilocal
    branch: main
    rootDir: frontend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /salud
    autoDeployTrigger: commit
    # Las NEXT_PUBLIC_* se incrustan al compilar: Render las pasa a la
    # construcción de la imagen como argumentos, y cambiar una exige volver a
    # construir, no reiniciar.
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://servilocal-api.onrender.com/api
      - key: NEXT_PUBLIC_SITE_URL
        value: https://servilocal-web.onrender.com
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PROXY_SECRETO
        sync: false
